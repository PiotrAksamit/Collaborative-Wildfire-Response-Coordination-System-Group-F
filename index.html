<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Incident Reporting System</title>

    <link rel="stylesheet" href="css/style.css">

    <script src="js/map.js" defer></script>
</head>

<body>

    <div class="header">
        <h1>Trossachs Live Incident Map</h1>
    </div>

    <div class="navigation">
        <a class="home-button" href="index.html">Home</a>
        <a class="report-button" href="add.html">Report Incident</a>
    </div>

    <div class="main">

        <h2>Incident Map</h2>

        <div class="page-layout">

            <div class="map-section">

                <div id="map" class="map">
                    <img src="assets/map.jpg" alt="map">
                </div>

            </div>

            <div class="sidebar">

                <div class="incident-section">
                    <h2>Active Incidents</h2>

                    <ul id="incidentList">
                        <li>South Forest - Fire</li>
                        <li>North Lake - Injury</li>
                    </ul>
                </div>

                <div class="responder-section">
                    <h2>Active Responders</h2>

                    <ul id="responderList">
                        <li>Responder 1</li>
                        <li>Responder 2</li>
                    </ul>
                </div>

            </div>

        </div>

    </div>

</body>
</html>
